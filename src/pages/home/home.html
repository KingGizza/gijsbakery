<main>
  <div>
    <h1>Welkom op  gijs bakery!</h1>
  </div>

  <div class="zoekbalk">
    <input type="search" placeholder="zoek een recept..." (input)="zoek($event)" />
    @if (zoekterm().trim() !== '') {
      <ul>
        @for (pagina of resultaten(); track pagina.pad) {
          <li><a [routerLink]="pagina.pad">{{ pagina.naam }}</a></li>
        } @empty {
          <li>niets gevonden</li>
        }
      </ul>
    }
  </div>

  <button matButton [matMenuTriggerFor]="aboveMenu" style="background-color: green">Hoofdgerechten</button>
  <mat-menu #aboveMenu="matMenu" yPosition="above">
    <button mat-menu-item style="background-color: darkred" (click)="openPizza()">Pizza</button>
    <button mat-menu-item style="background-color: aqua" (click)="openGizza()">pannekoeken</button>
    <button mat-menu-item style="background-color: chocolate" (click)="openlasagne()">lasagne</button>
    <button mat-menu-item style="background-color: yellow" (click)="openmacncheese()">macncheese</button>
    <button mat-menu-item style="background-color: peru" (click)="openPoffertjes()">poffertjes</button>
    <button mat-menu-item style="background-color: orangered" (click)="openflatbreadcrispychicken()">flatbread crispy chicken</button>
    <button mat-menu-item style="background-color: tomato" (click)="openpastasaus()">pastasaus</button>
    <button mat-menu-item style="background-color: goldenrod" (click)="opennasigoreng()">nasi goreng</button>
  </mat-menu>
  <button matButton [matMenuTriggerFor]="afterMenu" style="background-color: chocolate">Tussendoortjes</button>
  <mat-menu #afterMenu="matMenu" xPosition="after">
    <button mat-menu-item style="background-color: red" (click)="openkoekjes()">koekjes</button>
    <button mat-menu-item style="background-color: lightgreen" (click)="openeierkoeken()">eierkoeken</button>
    <button mat-menu-item style="background-color: blueviolet" (click)="opencupcakes()">cupcakes</button>
<div>

</div>

</mat-menu>
  <button matButton [matMenuTriggerFor]="overigeMenu" style="background-color: steelblue">Overige</button>
  <mat-menu #overigeMenu="matMenu" xPosition="after">
    <button mat-menu-item style="background-color: lightblue" (click)="openwiebenik()">wie ben ik</button>
  </mat-menu>
  <button matButton [matMenuTriggerFor]="snacksMenu" style="background-color: rgb(255, 0, 111)">Snacks</button>
  <mat-menu #snacksMenu="matMenu" xPosition="after">
    <button mat-menu-item style="background-color: gold" (click)="openloempia()">loempia</button>
    <button mat-menu-item style="background-color: sandybrown" (click)="openknakworstjes()">knakworstjes in bladerdeeg</button>
  </mat-menu>
    <picture>
      <source media="(min-width:465px)" srcset="DSC07056.jpg">     <p>ik ben gijs boerema (8 jaar)</p>
      <img src="DSC07056.jpg" alt="foto van Gijs" style="width:200px" />
    </picture>
<router-outlet />
</main>
