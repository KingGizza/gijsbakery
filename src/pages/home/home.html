  <button matButton [matMenuTriggerFor]="aboveMenu" style="background-color: grey">Hoofdgerechten</button>
  <mat-menu #aboveMenu="matMenu" yPosition="above">
    <button mat-menu-item (click)="openPizza()">Pizza</button>
    <button mat-menu-item (click)="openGizza()">pannekoeken</button>
    <button mat-menu-item (click)="openlasagne()">lasagne</button>

  <mat-menu #afterMenu="matMenu" xPosition="after">
    <button mat-menu-item (click)="openkoekjes()">koekjes</button>
    <button mat-menu-item (click)="openeierkoeken()">eierkoeken</button>
    <button mat-menu-item (click)="opencupcakes()">cupcakes</button>
  </mat-menu>
