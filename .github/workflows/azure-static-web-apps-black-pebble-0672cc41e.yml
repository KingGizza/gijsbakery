# CI/CD for Azure Static Web Apps (explicit, safer)
name: CI/CD - Azure Static Web Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
 # Build (produce artifacts and normalize to dist/sun-60-win)
- name: Build (and prepare artifact)
  run: |
    set -euo pipefail
    cd swa-db-connections

    echo "Node: $(node --version || true)"
    echo "NPM: $(npm --version || true)"

    npm ci
    npm run build

    echo "Looking for build outputs..."
    # prefer common folders
    if [ -d build ] && [ "$(ls -A build)" ]; then
      SRC="build"
    elif [ -d dist ] && [ "$(ls -A dist)" ]; then
      SRC="dist"
    elif [ -d public ] && [ "$(ls -A public)" ]; then
      SRC="public"
    else
      echo "No build output found (build/dist/public). Listing repo:"
      ls -la
      exit 1
    fi

    echo "Detected build output in: $SRC"
    TARGET="dist/sun-60-win"
    mkdir -p "$TARGET"
    echo "Copying $SRC -> $TARGET"
    cp -a "$SRC"/. "$TARGET"/
    echo "Contents of $TARGET:"
    ls -la "$TARGET" | sed -n '1,200p'

# Debug: show workspace before deploy (optional but useful)
- name: Debug: show workspace & artifact
  run: |
    echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
    pwd
    echo "Root listing:"
    ls -la
    echo "swa-db-connections listing:"
    ls -la swa-db-connections || true
    echo "Expected artifact path (repo-relative): swa-db-connections/dist/sun-60-win"
    ls -la swa-db-connections/dist/sun-60-win || true

# Deploy
- name: Deploy to Azure Static Web Apps
  uses: Azure/static-web-apps-deploy@v1
  with:
    azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    repo_token: ${{ secrets.GITHUB_TOKEN }}
    action: "upload"
    app_location: "swa-db-connections"      # folder containing your project
    api_location: ""                        # leave empty if none
    output_location: "dist/sun-60-win"      # relative to app_location

      - name: Debug: show workspace & artifact
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          pwd
          echo "Root listing:"
          ls -la
          echo "swa-db-connections listing:"
          ls -la swa-db-connections || true
          echo "Build output check (relative to app_location):"
          ls -la swa-db-connections/dist || true
          ls -la swa-db-connections/dist/sun-60-win|| true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "swa-db-connections"       # change to "/" if app is at repo root
          api_location: ""                         # set if you have an API folder
          output_location: "dist/sun-60-win"     # relative to app_location
