# CI/CD for Azure Static Web Apps (explicit, safer)
name: CI/CD - Azure Static Web Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    - name: Build (and prepare artifact)
  run: |
    cd swa-db-connections
    npm ci
    npm run build

    # ensure artifact folder expected by the SWA exists
    mkdir -p dist/sun-60-win
    if [ -d build ] && [ "$(ls -A build)" ]; then
      cp -a build/. dist/sun-60-win/
    elif [ -d dist ] && [ "$(ls -A dist)" ]; then
      cp -a dist/. dist/sun-60-win/
    elif [ -d public ] && [ "$(ls -A public)" ]; then
      cp -a public/. dist/sun-60-win/
    else
      echo "No build output found. Failing."
      exit 1
    fi
  deploy:
    name: Deploy (only runs on push to main)
    needs: build
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AZURE SWA token exists
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "ERROR: AZURE_STATIC_WEB_APPS_API_TOKEN secret is missing or empty"
            exit 1
          else
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN present (length: $(echo -n "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" | wc -c) chars)"
          fi

      - name: Debug: show workspace & artifact
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          pwd
          echo "Root listing:"
          ls -la
          echo "swa-db-connections listing:"
          ls -la swa-db-connections || true
          echo "Build output check (relative to app_location):"
          ls -la swa-db-connections/dist || true
          ls -la swa-db-connections/dist/sun-60-win|| true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "swa-db-connections"       # change to "/" if app is at repo root
          api_location: ""                         # set if you have an API folder
          output_location: "dist/sun-60-win"     # relative to app_location
