# .github/workflows/azure-static-web-apps-black-pebble-0672cc41e.yml
name: CI/CD - Azure Static Web Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install & Build (repo root)
        run: |
          set -euo pipefail
          echo "Working directory: $(pwd)"
          ls -la
          # Install and build at repo root. If your project is inside a subfolder, cd there instead.
          npm ci
          npm run build
          echo "Build outputs (root/dist):"
          ls -la dist || true
          ls -la dist/materialtest || true

      - name: Prepare artifact for SWA (ensure expected path exists)
        run: |
          # Ensure artifact path exists. If your artifact is already at dist/materialtest this is a no-op.
          mkdir -p dist/materialtest
          echo "Contents of dist/materialtest:"
          ls -la dist/materialtest || true

  deploy:
    name: Deploy (only runs on push to main)
    needs: build
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AZURE SWA token exists
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "ERROR: AZURE_STATIC_WEB_APPS_API_TOKEN secret is missing or empty"
            exit 1
          else
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN present (length: $(echo -n "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" | wc -c) chars)"
          fi

      - name: Debug: show workspace & artifact
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          pwd
          echo "Root listing:"
          ls -la
          echo "dist listing (repo root):"
          ls -la dist || true
          echo "dist/materialtest listing:"
          ls -la dist/materialtest || true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "/"                  # repo root (adjust if your app is in a subfolder)
          api_location: ""                   # set if you have an API folder
          output_location: "dist/materialtest"   # <--- changed output location you requested
